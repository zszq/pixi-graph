<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pixi-graph demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #graph {
        width: 100vw;
        height: 100vh;
      }
      #right-panel {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 3;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 180px;
      }
      #right-panel button {
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 13px;
        text-align: left;
      }
      #right-panel button:hover {
        background: #f3f4f6;
      }
      #right-panel button.active {
        background: #4a5fe2;
        border-color: #4a5fe2;
        color: #fff;
      }
      #right-panel .divider {
        height: 1px;
        background: rgba(0, 0, 0, 0.12);
        margin: 2px 0;
      }
      #datasets {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 160px;
      }
      #datasets .title {
        font-size: 12px;
        color: #6b7280;
        margin-bottom: 2px;
      }
      #datasets button {
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 13px;
        text-align: left;
      }
      #datasets button:hover {
        background: #f3f4f6;
      }
      #datasets button.active {
        background: #4a5fe2;
        border-color: #4a5fe2;
        color: #fff;
      }
      /* 加载进度遮罩：盖住画布，避免大数据加载时长时间白屏 */
      #loading {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #fff;
        transition: opacity 0.3s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading .track {
        width: 280px;
        height: 8px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
      }
      #loading .bar {
        height: 100%;
        width: 0;
        background: #4a5fe2;
        border-radius: 999px;
        transition: width 0.15s ease;
      }
      #loading .text {
        font-size: 13px;
        color: #374151;
      }
      #loading .pct {
        font-size: 12px;
        color: #9ca3af;
      }
      #fps {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 3;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(17, 24, 39, 0.78);
        color: #fff;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="graph"></div>
    <div id="fps">FPS --</div>
    <div id="loading">
      <div class="text" id="loading-text">准备中…</div>
      <div class="track"><div class="bar" id="loading-bar"></div></div>
      <div class="pct" id="loading-pct">0%</div>
    </div>
    <div id="datasets"></div>
    <div id="right-panel">
      <button id="add-node">Add Node</button>
      <button id="remove-node">Remove Node</button>
      <button id="add-edge">Add Edge</button>
      <button id="remove-edge">Remove Edge</button>
      <button id="toggle-select">Box Select: Off</button>
      <button id="recenter">Reset View</button>
      <div class="divider"></div>
      <button id="zoom-in">Zoom In</button>
      <button id="zoom-out">Zoom Out</button>
      <button id="watermark">Toggle Watermark</button>
      <button id="extract">Extract PNG</button>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
